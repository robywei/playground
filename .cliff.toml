## git-cliff 設定 —— 從 git log 生成 CHANGELOG.md
##
## 格式依據 Keep a Changelog（https://keepachangelog.com/en/1.1.0/），
## 條目樣式參考 git-cliff 官方 CHANGELOG（scope 斜體 + 行尾 commit 連結）。
##
## 本檔刻意設計為**跨 repo 通用**，複製到任何 repo 都能直接用：
##   * 有版本 tag 的 repo → 走標準 KaC：版本 heading ＋ compare 連結 ＋ 分類 heading
##   * 無版本 tag 的 repo → 走 CalVer 變體：月 / 日兩層 heading（IaC repo 適用；
##     月層對得上月度歸檔的粒度）
## 分岔由模板的 `{% if version %}` 自動判斷；commit 連結的 owner/repo 由 git-cliff
## **從 `git remote` 自動偵測**（`remote.github.*`），一樣不需要改設定。
##
## 🔗 **本檔是跨 repo 標準版 —— 下列 4 個 repo 使用逐字相同的一份，改動請同步全部**：
##   * https://github.com/axiom-infra/k8s-infra
##   * https://github.com/axiom-infra/vm
##   * https://github.com/axiom888/vone-cd-devops-deploy
##   * https://github.com/axiom888/x-cd-devops-deploy
##   各 repo 的差異靠 `commit_parsers` 的 no-op 規則吸收（例：`[skip ci]` 那條只有部署
##   repo 會命中），**不要為了「這裡用不到」而刪掉** —— 那會讓四份檔案開始分岔。
##   ⚠️ **驗證要掃範圍，不要照這份清單逐一比** —— 清單漏列的症狀是靜默的：
##   漏掉的那份不會被同步，也不會有任何一側報錯。2026-08-31 實測本清單只寫了 2 個、
##   實際有 4 份（漏掉 vm 與 x），而四份當時仍逐字相同純屬僥倖。範圍式驗證：
##   `find ~/Git -maxdepth 4 -name .cliff.toml | while read -r f; do diff -q "$f" .cliff.toml; done`
##
## 📌 **實際輸出長什麼樣，直接看 `CHANGELOG.md`** —— 本檔刻意不複製一份格式範例。
##    2026-08-28 實測：註解裡的格式字串在同一輪對話內就漂移兩次（漏掉 emoji、
##    漏掉月份層），而下面那些「為什麼 / 踩雷」一次都沒漂移 —— 因為它們陳述的是
##    規範與實測結果，不是輸出的副本。**會漂移的是副本，不是知識。**
##
## 🔑 **條目只輸出 commit 主旨，不含 body** —— body 是主旨的展開，而條目行尾已經帶了
##    commit 連結，放進來等於同一份內容存兩遍。實測：含 body 時三天 660 行、
##    推算一個月約 8500 行（比改制前手寫的 6433 行還長）；只留主旨是一個月約 1400 行。
##    細節不會因此難找 —— `git log --grep=<關鍵字>` / `git log -S` 照樣搜得到 message 全文。
##    ⚠️ 若日後要改回顯示 body，`commit_preprocessors` 需補回三條：剝 trailer、
##    清單符號正規化（MD004）、行首 `#` 標題降級（否則會與 `## 📆 <日期>` 同級汙染結構）。
##
## ⚠️ 五個實測踩雷（改本檔前務必知道，全部踩過）：
##   1. TOML `"""` 字串的**行尾 `\` 會吃掉換行與其後所有前導空白** —— TOML 規範，
##      不是 git-cliff 的行為。官方範例大量用 `\` 續行，照抄會讓縮排全部消失、
##      巢狀清單被打平，而輸出看起來只像「模板沒寫對」。本檔一律用 Tera 的 `{%- -%}`。
##      唯一刻意用 `\` 的地方是 header 結尾（見踩雷 4）。
##   2. `trim = false` **必須明設**：預設會 trim 每行，縮排一樣會消失（症狀同上）。
##   3. `sort_commits = "newest"` **必須明設**：預設是舊到新，CHANGELOG 會整個顛倒。
##   4. **header 與 body 是「分別 postprocess 再拼接」** —— 接縫處的換行不會被任何
##      postprocessor 看到，只能靠 header 結尾的 `\` 與 body 開頭的 `{%- -%}` 控制。
##   5. postprocessors 的 pattern 必須用 **basic string（雙引號）**：單引號是 TOML
##      literal string，`\n` 會原樣傳成兩個字元 → 規則靜默失效（無錯誤、輸出照產）。

[changelog]
header = """
<!-- 本檔是生成物，`lint.sh md --fix` 對它無效 —— 下次生成就覆蓋回去。 -->

# 📋 Changelog

The format is based on:
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
[git-cliff](https://github.com/orhun/git-cliff/)\
"""

## 條目來源是 commit message（主旨 + body）→ **message 品質即 CHANGELOG 品質**。
## 生成後無法事後修改（改 message ＝ 改寫歷史），只能在後續 commit 補說明。
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
{%- macro entry(commit, with_group) -%}
- {% if with_group %}**{{ commit.group }}** {% endif %}\
{%- if commit.scope %}*({{ commit.scope }})* {% endif %}\
{%- if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message }}\
{%- if remote.github.owner %} - ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }})){% endif %}
{%- endmacro -%}
{% if version -%}
## 🏷️ [{{ version | trim_start_matches(pat="v") }}]\
{%- if previous.version %}({{ self::remote_url() }}/compare/{{ previous.version }}..{{ version }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{%- for group, group_commits in commits | group_by(attribute="group") %}

### {{ group }}
{%- for commit in group_commits %}

{{ self::entry(commit=commit, with_group=false) }}
{%- endfor %}
{%- endfor %}
{%- else -%}
{%- set_global last_month = "" %}
{%- set_global last_date = "" %}
{%- for commit in commits %}
{%- set m = commit.author.timestamp | date(format="%Y-%m") %}
{%- set d = commit.author.timestamp | date(format="%Y-%m-%d") %}
{%- if m != last_month %}
{% if last_month != "" %}
{% endif %}## 📆 {{ m }}
{%- set_global last_month = m %}
{%- set_global last_date = "" %}
{%- endif %}
{%- if d != last_date %}
{% if last_date != "" %}
{% endif %}
### 📅 {{ d }}
{%- set_global last_date = d %}
{%- endif %}

{{ self::entry(commit=commit, with_group=true) }}
{%- endfor %}
{%- endif %}
"""
footer = """

<!-- generated by git-cliff —— 請勿手動編輯，內容來源是 commit message -->\
"""
trim = false

## 作用於**最終輸出**（commit_preprocessors 作用於單一 commit message，兩者不可互換）
postprocessors = [
  { pattern = "\n{3,}", replace = "\n\n" },       ## MD012 連續空行
  { pattern = "\n+$", replace = "\n" },           ## MD047 檔案以單一換行結尾
  { pattern = "(?m)[ \t]+$", replace = "" },      ## MD009 行尾空白
  ## MD034：commit 主旨裡的裸 URL（例：GitHub Actions 產的 `Run: https://…`）包成 autolink。
  ## 只匹配「前面是空白」的 URL → 條目行尾的 `([hash](https://…))` 與 header 的
  ## `[text](url)` 前面是 `(`，不會被誤傷（Rust regex 無 lookbehind，只能靠這個區隔）。
  { pattern = "(\\s)(https?://[^\\s)>\\]]+)", replace = "${1}<${2}>" },
]

[git]
sort_commits = "newest"          ## ⚠️ 見檔頭踩雷 3
conventional_commits = true
filter_unconventional = false    ## 不符 conventional 的 commit 也收錄，不靜默漏掉
protect_breaking_commits = true

## ⚠️ 只把 `vX.Y.Z` 形式視為版本 tag。本 repo 目前零 tag，但**日後打了任何非版本 tag
##    就會讓 git-cliff 分段、同一個日期標題重複出現，格式當場壞掉**。這行是防呆不是裝飾。
tag_pattern = "v[0-9]*"

## 條目只輸出主旨（見檔頭 🔑），主旨本身不含 trailer、清單符號或 markdown 標題，
## 所以這裡刻意留空。要改回顯示 body 時需補回的三條見檔頭。
commit_preprocessors = []

## 分類映射：前四類對齊 Keep a Changelog 規範，後三類是明示的擴充 ——
## KaC 六類沒有 docs / ops / chore（規範認為那不是 notable change），
## 但本 repo 的 commit 以 docs 佔多數（判準、踩雷入庫），硬套六類會讓 CHANGELOG 空掉大半。
commit_parsers = [
  ## 生成動作本身不是變更 —— 不 skip 的話，每次「生成 → commit」都會在下一輪
  ## 生成的 CHANGELOG 裡多一條 chore(changelog) 噪音條目
  { message = "^chore\\(changelog\\)", skip = true },
  ## CI 自動的版本更新（`[skip ci] [env] service: v1 → v2`）不入 CHANGELOG：
  ## 它是部署紀錄、不是人為變更，git log 必定可查。**本 repo 無此類 commit，這條是 no-op**，
  ## 留著是為了讓 vone / x 等部署 repo 能用逐字相同的一份 config（見檔頭「跨 repo 同步」）。
  { message = "^\\[skip ci\\]", skip = true },
  { message = "^feat",                    group = "✨ Added"   },
  { message = "^fix",                     group = "🐛 Fixed"   },
  { message = "^refactor|^perf|^style",   group = "✏️ Changed" },
  { message = "^cleanup|^revert",         group = "🗑️ Removed" },
  { message = "^docs",                    group = "📚 Docs"    },
  { message = "^ops",                     group = "🔧 Ops"     },
  { message = "^chore|^ci|^build|^test",  group = "⚙️ Chore"   },
  { message = ".*",                       group = "✏️ Changed" },
]

## trivy 自訂 secret 規則（trivy-cli.sh repo 模式以 --secret-config 載入；內建規則照常啟用）
##
## 由 repo-template 產生一次，之後歸本 repo 維護，範本 update 不會覆蓋 —— 本 repo 的規則與豁免直接加在這裡。
## trivy 的 --secret-config 只吃一份檔，所以規則與豁免都寫在同一份。
##
## plaintext-auth-password：內建規則只認「有固定前綴」的憑證（`ghp_`、`xoxb-`、`AKIA`…），
##   **沒有前綴的密碼完全看不到**（SMTP、資料庫、管理後台的密碼多半是這一型）。
##   這條抓「password 類鍵名 ＋ 字面值」，佔位（`${VAR}`、`$VAR`、`<...>`、`""`）與註解行不算。
##
## ⚠️ 加豁免前先量命中：`trivy fs --scanners secret --secret-config <本檔> <repo 根>`，逐筆看是不是真的不用擋。
##    上游預設值傾印、型別定義、示範假值這類用 allow-rules 依路徑排除；自己的設定檔不要排除 —— 那正是要擋的地方。
## ⚠️ 改 regex 後用植入明文密碼的探針檔確認它還會紅（只看「沒命中」會把改壞當成乾淨）。

rules:
  - id: plaintext-auth-password
    category: general
    title: Plaintext password field (no placeholder)
    severity: HIGH
    keywords:
      - pass
    ## 行首到鍵名之間不可有 `#`（註解行不算）；鍵名前不可是 `$`（模板的 `$pass = ...`）；
    ## 值的第一個字元不可是 - $ % { < ( 引號（旗標、變數、printf 格式、模板、佔位）
    regex: |-
      (?im)^[^#\n]*?(?:^|[^$\w.-])[a-z0-9_.-]*pass(?:word|wd)?["']?[ \t]*[:=][ \t]*["']?(?P<secret>[^\s"'$<>{}()#,;|\[\]%-][^\s"'$<>{}()#,;|\[\]]{3,})
    secret-group-name: secret

## ⚠️ allow-rules 的 regex 比對的是整段命中文字（不是只有 secret 那個 group）→ 不能用 ^…$ 錨定值
## 範例：
##   - id: type-definitions
##     description: "型別定義"
##     path: '\.d\.ts$'
allow-rules: []
